<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082849"/>
      <stop offset="50%" stop-color="#0358a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Anchor Stem & Crossbar -->
  <g transform="translate(256, 256)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-120" r="36" fill="none" stroke="#ffffff" stroke-width="24"/>
    
    <!-- Crossbar -->
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Vertical Shank -->
    <line x1="0" y1="-84" x2="0" y2="110" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Curved Flukes / Arms -->
    <path d="M -130 30 C -130 145, 130 145, 130 30" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Fluke Arrowheads -->
    <polygon points="-146,30 -114,30 -130,0" fill="#ffffff"/>
    <polygon points="114,30 146,30 130,0" fill="#ffffff"/>

    <!-- Medical Plus Badge in the center -->
    <rect x="-42" y="-12" width="84" height="84" rx="20" fill="#082849" stroke="#34d399" stroke-width="6"/>
    <rect x="-10" y="8" width="20" height="44" rx="4" fill="url(#cross)"/>
    <rect x="-22" y="20" width="44" height="20" rx="4" fill="url(#cross)"/>
  </g>
</svg>
